; Committed on purpose — Godot cannot export without this file, and CI needs it.
; Fresh Godot projects gitignore it because it can hold signing paths and
; keystore passwords; this one holds none (builds are unsigned), so it is safe
; to track. If signing is ever set up, keep the credentials in Actions secrets
; rather than adding them here. See KVG_Standards' game-repos.md.
;
; embed_pck=true on the desktop presets so each build is one self-contained
; file instead of an executable plus a loose .pck the player has to keep beside
; it.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
