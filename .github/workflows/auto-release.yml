# Copied from KVG_Standards templates/auto-release.yml. Fires a release on EVERY
# push to main — no manual step. Coexists with cut-release.yml, which stays
# available for a deliberately-numbered release.
#
# The version bump (mathieudutour/github-tag-action) reads Conventional Commit
# prefixes to decide patch/minor/major, then creates and pushes the tag.
#
# Staying pre-1.0: `fix:` gives 0.1.x, `feat:` gives 0.x.0, and only an explicit
# breaking change (`feat!:` or a `BREAKING CHANGE:` footer) jumps to 1.0.0 — so
# avoid those until the game is ready to claim it.

name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump semantic version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

  release:
    needs: version
    if: ${{ needs.version.outputs.new_tag != '' }}
    uses: gerp93/KVG_Standards/.github/workflows/release-godot.yml@main
    with:
      version: ${{ needs.version.outputs.new_tag }}
      app_name: Airport
      # Must match the engine this project is authored in — Godot's export
      # templates are version-locked and export fails outright on a mismatch.
      godot_version: "4.7.1"
    permissions:
      contents: write
